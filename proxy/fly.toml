app = "rebalance-it-proxy"
primary_region = "nrt"  # 도쿄 (한국에서 가장 가까운 Fly.io 리전)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[env]
  PORT = "3001"
  KIWOOM_BASE_URL = "https://openapi.kiwoom.com"
